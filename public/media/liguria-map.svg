    />
    <text x="360" y="215" text-anchor="middle" class="region-label" fill="#10b981" font-size="16" font-weight="bold">Turchino</text>
  </g>

  <!-- Region 3: Genova (moved higher and more right) -->
  <g class="region-hover" data-region="genova-righi">
    <path
      d="M 480,165 Q 535,150 590,155 L 580,215 Q 525,215 490,235 Z"
