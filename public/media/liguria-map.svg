<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Background Image -->
  <image href="/media/liguria-blank.jpg" width="1000" height="400" preserveAspectRatio="xMidYMid slice"/>

  <!-- Region 1: Varazze (West - moved much more right) -->
  <g class="region-hover" data-region="varazze">
    <path
      d="M 150,280 Q 190,250 230,245 L 225,300 Q 185,305 155,325 Z"
      fill="rgba(251, 191, 36, 0.15)"
      stroke="#fbbf24"
      stroke-width="2"
      class="region-box"
    />
    <text x="195" y="280" text-anchor="middle" class="region-label" fill="#00d4ff" font-size="16" font-weight="bold">Varazze</text>
  </g>

  <!-- Region 2: Turchino (moved right where Genova was, higher) -->
  <g class="region-hover" data-region="turchino">
    <path
      d="M 300,210 Q 355,180 410,175 L 400,235 Q 345,240 310,265 Z"
      fill="rgba(251, 191, 36, 0.15)"
      stroke="#fbbf24"
      stroke-width="2"
